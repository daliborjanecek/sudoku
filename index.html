<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku Web Component — demo</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 {
        text-align: center;
      }
      .demos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 32px;
        max-width: 1200px;
        margin: 0 auto;
        align-items: start;
      }
      .demo {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      .demo h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      /* Custom theme for the third instance to show theming hooks. */
      .themed sudoku-game {
        --sudoku-accent: #7c3aed;
        --sudoku-user-color: #7c3aed;
        --sudoku-conflict-color: #ea580c;
      }
    </style>
  </head>
  <body>
    <h1>Sudoku Web Component</h1>
    <div class="demos">
      <div class="demo">
        <h2>Lehká (difficulty 1)</h2>
        <sudoku-game difficulty="1" storage-key="demo-easy"></sudoku-game>
      </div>
      <div class="demo">
        <h2>Střední (difficulty 3)</h2>
        <sudoku-game difficulty="3" storage-key="demo-medium"></sudoku-game>
      </div>
      <div class="demo themed">
        <h2>Těžká (difficulty 5, vlastní téma)</h2>
        <sudoku-game difficulty="5" storage-key="demo-hard"></sudoku-game>
      </div>
    </div>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
